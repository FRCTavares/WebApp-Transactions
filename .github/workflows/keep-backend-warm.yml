name: Keep backend warm and monitor availability

# This workflow's actual job is monitoring/alerting: a failed scheduled run
# triggers GitHub's default email notification to repo watchers. See
# docs/incident-response.md and docs/oauth-and-hosting-checklist.md for the
# reasoning.
#
# As of the Render -> Cloud Run migration, this backend uses
# --min-instances=0 (scale-to-zero). The cron below intentionally runs
# hourly rather than every 10 minutes, so this workflow does not itself keep
# an instance continuously warm and inflate Cloud Run usage -- it exists to
# catch outages within about an hour, not to defeat scale-to-zero. If an
# external cron-job.org ping against the old Render URL is still configured,
# it should be updated to the new Cloud Run URL or disabled.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping backend liveness
        run: |
          set -euo pipefail

          BACKEND_URL="https://webapp-transactions-backend-1025162530033.europe-west1.run.app"

          echo "Pinging backend liveness endpoint..."
          curl --fail --silent --show-error --location --max-time 120 \
            --write-out "\nHTTP status: %{http_code}\nTotal time: %{time_total}s\n" \
            "$BACKEND_URL/api/health"

      - name: Check backend readiness (database connectivity)
        run: |
          set -euo pipefail

          BACKEND_URL="https://webapp-transactions-backend-1025162530033.europe-west1.run.app"

          echo "Checking backend readiness endpoint..."
          curl --fail --silent --show-error --location --max-time 30 \
            --write-out "\nHTTP status: %{http_code}\nTotal time: %{time_total}s\n" \
            "$BACKEND_URL/api/ready"

      - name: Check frontend availability
        run: |
          set -euo pipefail

          FRONTEND_URL="https://web-app-transactions.vercel.app"

          echo "Checking frontend availability..."
          curl --fail --silent --show-error --location --max-time 30 \
            --write-out "\nHTTP status: %{http_code}\nTotal time: %{time_total}s\n" \
            "$FRONTEND_URL/" > /dev/null
